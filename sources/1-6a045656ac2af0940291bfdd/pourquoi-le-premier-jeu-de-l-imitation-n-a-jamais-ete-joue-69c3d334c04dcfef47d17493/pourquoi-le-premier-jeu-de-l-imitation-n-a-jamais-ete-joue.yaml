abstract:
- lang: fr
  text: 'We are updating the lesser-known gendered Turing Test by using both

    human participants and an LLM programmed to "play a woman." The

    experiment reveals how gendered imitation highlights cultural and

    interpretive biases, demonstrating that the original Turing Test exposes

    our assumptions about intelligence more than it assesses the machine''s

    cognitive abilities.'
