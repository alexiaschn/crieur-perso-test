  <script id="search-index" type="application/json">[
  {
    "title": "Agentivit\u00e9 \u00e9pist\u00e9mique et recherche assist\u00e9e par IA : un syst\u00e8me de recommandation transparent pour la recherche informationnelle exploratoire",
    "url": "/numero/corpus-crieur-test/article/agentivite-epistemique-et-recherche-assistee-par-ia-un-systeme-de-recommandation-transparent-pour-la-recherche-informationnelle-exploratoire/",
    "date": "13 mai 2026",
    "content": "Introduction\u00a0: le probl\u00e8me de la recherche assist\u00e9e par IA opaque Les syst\u00e8mes de recommandation (SR) int\u00e9gr\u00e9s aux moteurs de recherche scientifiques influencent ce que les chercheur\u00b7e\u00b7s voient, lisent et citent. Pourtant, ces syst\u00e8mes rendent rarement explicites les strat\u00e9gies de recherche d information (RI) \u00e0 l origne des articles pr\u00e9sent\u00e9s. En cons\u00e9quence, les SR reposent fr\u00e9quemment sur des m\u00e9triques non s\u00e9mantiques telles que le nombre de citations, renfor\u00e7ant des m\u00e9canismes de concentration des citations, \u00e9galement connus sous le nom de Matthew s effect (Merton, 1968). D autres syst\u00e8mes d\u00e9pendent fortement des interactions pass\u00e9es et enregistr\u00e9es des utilisateur\u00b7ice\u00b7s (Koster et al., 2014), cr\u00e9ant des risques de bulles de filtres (Pariser, 2011) et de biais de confirmation dans le travail scientifique (Underwood, 2014). Le glissement actuel vers des \"assistants IA\" conversationnels, reposant sur un paradigme g\u00e9n\u00e9rique de requ\u00eates en langue naturelle analys\u00e9es par des grands mod\u00e8les de langue (GML), rend de plus en plus pressantes les questions de mod\u00e9lisation alternative, d interpr\u00e9tabilit\u00e9 et d agentivit\u00e9 \u00e9pist\u00e9mique que les Humanit\u00e9s Num\u00e9riques adressent (Goodlad, 2023; Vitali-Rosati, 2025). Si les m\u00e9canismes derri\u00e8re les recommandations g\u00e9n\u00e9r\u00e9es par l IA demeurent opaques, les chercheur\u00b7e\u00b7s perdent la capacit\u00e9 d \u00e9valuer de mani\u00e8re critique la fa\u00e7on dont la pertinence est construite. Notre question de recherche principale est la suivante\u00a0: quelle alternative aux assistants de recherche IA peut \u00eatre con\u00e7ue afin de mettre en avant des connexions inattendues de mani\u00e8re explicable et transparente pour l utilisateur\u00b7ice\u202f? Pour donner plus de perspective \u00e0 cette question\u00a0: qu est-ce qu une comparaison directe entre une ontologie symbolique et une recherche s\u00e9mantique fond\u00e9e sur les GML peut r\u00e9v\u00e9ler sur leurs mod\u00e8les \u00e9pist\u00e9miques sous-jacents\u202f? Ancr\u00e9e dans les propositions de (Drucker, 2013), l outil d\u00e9velopp\u00e9 pour r\u00e9pondre \u00e0 ces questions se veut un r\u00e9v\u00e9lateur d incertitudes et d interpr\u00e9tations subjectives afin de sensibiliser \u00e0 la litt\u00e9ratie en IA. Nous pr\u00e9sentons ainsi IEML-RS, un SR reposant sur un processus collaboratif et it\u00e9ratif de construction de requ\u00eates pour une phase de recherche d information exploratoire r\u00e9flechie et transparente. Nous pr\u00e9sentons dans un deuxi\u00e8me temps l \u00e9valuation de l outil \u00e0 travers les r\u00e9sultats d une \u00e9tude utilisateur et sur l \u00e9valuation technique du parsing s\u00e9mantique en IEML produit par des GML. Contexte et \u00e9tat de l art Les outils r\u00e9cents de recherche assist\u00e9e par IA fonctionnent sur l utilisation de GML pour l expansion de requ\u00eates, le classement de pertinence et la synth\u00e8se automatis\u00e9e, \u00e0 toutes ces \u00e9tapes, les \"choix\" du mod\u00e8le sont probabilistes; l hypoth\u00e8se distributionnelle (Firth, 1962; Harris, 1981) au coeur de ces algorithmes et de l IA connexionniste suppose que les fr\u00e9quences de cooccurrences d unit\u00e9s syntaxiques permettent \u00e0 elles-seules de reconstruire la langue et indirectement, ses aspects s\u00e9mantiques. Bien qu efficace pour la production de texte, cette approche renforce implicitement les connexions et les chemins s\u00e9mantiques les plus probables, ce qui dans le cas de la publication acad\u00e9mique risque de privil\u00e9gier une litt\u00e9rature d\u00e9j\u00e0 cit\u00e9e et de r\u00e9duire l espace \u00e9pist\u00e9mique de la d\u00e9couverte (Nielsen & Andersen, 2021; Varga, 2022). Les \u00e9valuations des assistants de recherche fond\u00e9s sur l IA montrent \u00e9galement une opacit\u00e9 persistante, un rappel in\u00e9gal et une tendance \u00e0 survaloriser les travaux dominants ou fortement cit\u00e9s (Patterson et al., 2025; Archambault & Rinc\u00f3n, 2024). Comme le soutient (Tay, 2025), le manque de transparence des syst\u00e8mes contemporains de RI fond\u00e9s sur les GML complique la capacit\u00e9 des utilisateur\u00b7ice\u00b7s \u00e0 \u00e9valuer de mani\u00e8re critique les r\u00e9sultats, soulignant la n\u00e9cessit\u00e9 d approches mettant au premier plan l explicabilit\u00e9 et l agentivit\u00e9 des utilisateur\u00b7ice\u00b7s. En tant qu objectif, la s\u00e9rendipit\u00e9 et la recherche exploratoire proposent un paradigme alternatif dans la construction des SR. Des travaux fondateurs conceptualisent la s\u00e9rendipit\u00e9 comme un processus it\u00e9ratif men\u00e9 par l utilisateur\u00b7ice, de \"berrypicking\", dans lequel les requ\u00eates \u00e9voluent par variantes au fil d un parcours non lin\u00e9aire alternant rencontres de documents et d id\u00e9es (Bates, 1989; Erdelez, 1999). Des mod\u00e8les ult\u00e9rieurs soulignent la nature \u00e9valuative et d\u00e9finie par l utilisateur\u00b7ice de la s\u00e9rendipit\u00e9\u00a0: une d\u00e9couverte ne devient \"trouvaille\" qu a posteriori, lorsqu on est \u00e0 m\u00eame de r\u00e9interpr\u00e8ter sa pertinence (Lawley & Tompkins, 2008; Makri & Blandford, 2012). Des \u00e9tudes empiriques en contexte acad\u00e9mique confirment le r\u00f4le de la s\u00e9rendipit\u00e9 dans la diversification des pratiques de lecture et le d\u00e9veloppement d expertises transdisciplinaires (Foster & Ford, 2003). Des exemples d appropriation d\u00e9tourn\u00e9e des fonctionnalit\u00e9s principales des moteurs de recherche sugg\u00e8rent que les pratiques effectives de recherche restent encore largement non cartographi\u00e9es et plus diverses que ne le laissent entendre les pratiques guid\u00e9es actuelles de RI (Dumas Primbault, 2023). Pourtant, la majorit\u00e9 des SR demeurent orient\u00e9e vers la personnalisation et l interrogation en langue naturelle, visant une RI intuitive plut\u00f4t qu une exploration \u00e9tendue ou un soutien \u00e0 l engagement des chercheur\u00b7se\u00b7s dans la complexit\u00e9 de leurs propres investigations. Quelques outils scientifiques tentent de r\u00e9introduire l exploration dans la RI pour la recherche scientifique. Bridger (Portenoy et al., 2022) expose les chercheur\u00b7se\u00b7s \u00e0 des auteur\u00b7ice\u00b7s ext\u00e9rieur\u00b7e\u00b7s \u00e0 leurs r\u00e9seaux intellectuels habituels afin de favoriser le d\u00e9cloisonnement disciplinaire. VITALITY (Narechania et al., 2022) propose une approche de revue de litt\u00e9rature fond\u00e9e sur la visualisation, mais repose sur des corpus fortement s\u00e9lectionn\u00e9s et pr\u00e9trait\u00e9s. D autres projets, tels que STAK (Martin et al., 2017), s est inspir\u00e9 des affordances mat\u00e9rielles des biblioth\u00e8ques physiques en tentant de recr\u00e9er des environnements de navigation spatialis\u00e9s. +-------------------------------------+----------------------------------+ | ------------- ------------------- | Les alternatives aux approches | | Mot-cl\u00e9 conteuse | fond\u00e9es sur les GML incluent les | | Th\u00e8me communication | graphes de connaissances et les | | Qui ~f\u00e9minin conteur | ontologies du Web s\u00e9mantique. Au | | Quoi r\u00e9cit | sein des repr\u00e9sentations | | \u00c0 qui | s\u00e9mantiques symboliques, OWL et | | Par quoi | RDF sont des formalismes bien | | Quand | \u00e9tablis, et l Information | | O\u00f9 | Economy MetaLanguage (IEML) | | Pourquoi | (L\u00e9vy, 2023) | | Comment | bien que moins connu, offre une | | ------------- ------------------- | alternative flexible pertinente | | | pour l exploration de champs | | \u00a0: D\u00e9composition s\u00e9mantique avec | conceptuel. IEML est un langage | | IEML | d explicitation s\u00e9mantique | | | fond\u00e9e sur une logique de | | | composition \u00e0 partir d unit\u00e9s | | | s\u00e9mantiques pr\u00e9d\u00e9finies. Les | | | dimensions s\u00e9mantiques | | | constituent une ontologie fixe | | | de neuf aspects | | | (th\u00e8me/processus, qui, quoi, \u00e0 | | | qui, par quels moyens, quand, | | | o\u00f9, pourquoi, comment) | | | permettant des d\u00e9finitions | | | flexibles et heuristiques de | | | tout concept dans une structure | | | ais\u00e9ment intelligible et | | | manipulable. | +-------------------------------------+----------------------------------+ []{#tabl-ieml} Le Tableau offre une visualisation explicite d une traduction attendue en IEML du concept de \"conteuse\"\u00a0: tous les aspects ne sont pas obligatoirement remplis et la flexion d une valeur peut \u00eatre signifi\u00e9e par le symbole ~. Alors que les GML sont de plus en plus utilis\u00e9s pour des t\u00e2ches complexes de parsing s\u00e9mantique non structur\u00e9, des \u00e9valuations r\u00e9centes montrent qu ils demeurent peu fiables pour les langages s\u00e9mantiques structur\u00e9s. Par exemple, les mod\u00e8les d OpenAI ont obtenu de faibles performances dans la g\u00e9n\u00e9ration d Abstract Meaning Representation (AMR), m\u00eame avec quelques exemples dans le prompt (Ettinger et al., 2023). Cela renforce la n\u00e9cessit\u00e9 de cadres s\u00e9mantiques explicites et interpr\u00e9tables dans la RI scientifique. Contrairement \u00e0 la repr\u00e9sentation canonique unique de l AMR, IEML propose une d\u00e9composition s\u00e9mantique flexible et ajustable par l utilisateur\u00b7ice, susceptible de soutenir la variation exploratoire. Cependant, aucun travail ant\u00e9rieur n a examin\u00e9 la traduction automatique en IEML ni son int\u00e9gration dans des syst\u00e8mes de recommandation. Ensemble, ces lacunes motivent la n\u00e9cessit\u00e9 de SR transparents et ancr\u00e9s dans une logique interpr\u00e9tative, qui pr\u00e9servent le contr\u00f4le des utilisateur\u00b7ice\u00b7s, soutiennent la variation exploratoire et rendent visibles les diff\u00e9rences \u00e9pist\u00e9miques entre approches symboliques et connexionnistes. L outil IEML-RS contribue \u00e0 cet espace en offrant une comparaison double, c\u00f4te \u00e0 c\u00f4te, entre une recherche fond\u00e9e sur l ontologie et une recherche s\u00e9mantique fond\u00e9e sur les GML dans un contexte r\u00e9el de d\u00e9couverte scientifique. IEML-RS Notre syst\u00e8me de recommandation d articles est une extension du navigateur Firefox en Javascript qui dialogue avec le moteur de recherche Isidore pour les SHS francophones via son site web (en extrayant les m\u00e9tadonn\u00e9es de l article de d\u00e9part) et son API (fonction de recherche d articles par mots-cl\u00e9s). L utilisateur\u00b7ice commence sur une page d article dont les m\u00e9tadonn\u00e9es sont extraites. Les mots-cl\u00e9s dont une traduction valid\u00e9e manuellement existe sont pr\u00e9sent\u00e9s en bleus, les autres sont en oranges. ::: {.columns-flow count=\"2\"} []{#grid} La s\u00e9lection d un mot-cl\u00e9 fait appara\u00eetre son forme de grille sa traduction en IEML, soit sous forme valid\u00e9e (mots-cl\u00e9s bleus), soit sous forme de grille \u00e0 corriger (mots-cl\u00e9s oranges). La s\u00e9lection d une cellule de la grille fait appara\u00eetre tous les mots-cl\u00e9s utilisant le m\u00eame concept. Dans l exemple de la fig.{.ref}, la s\u00e9lection de la facette th\u00e8me \"th\u00e9orie\" du mot-cl\u00e9 \"\u00e9ditorialisation\" r\u00e9v\u00e8le que les mots-cl\u00e9s \"auctorialit\u00e9\", \"corpus litt\u00e9raire\", \"herm\u00e9neutique\" etc. sont aussi traduits avec \"th\u00e9orie\" dans leur grille IEML. En proposant une conceptualisation simple sous la forme d une grille qu il est possible \u00e0 son tour de remplir, les utilisateur\u00b7ice\u00b7s non familier\u00b7e\u00b7s avec IEML peuvent ais\u00e9ment \u00e9tablir des connexions s\u00e9mantiques complexes tout en apprenant \u00e0 utiliser le SR. ::: ::: {.columns-flow count=\"2\"} []{#trad-ieml} L un des int\u00e9r\u00eat saillant du RS repose dans la port\u00e9e reflexive du processus de construction de la requ\u00eate, processus qui \u00e9mane de la matrice de d\u00e9composition s\u00e9mantique en IEML (voir (tabl-ieml?)) mais aussi de la traduction automatique en IEML d un mot-cl\u00e9 g\u00e9n\u00e9r\u00e9e par gemma-3n-E4B-it (voir figure{.ref}). Correction et validation par l utilisateur\u00b7ice de la grille pr\u00e9-remplie par GML impliquent une forme de mise en dialogue r\u00e9flexive non seulement avec le concept s\u00e9lectionn\u00e9 mais aussi, indirectement, avec le GML qui a produit la proposition de traduction. ::: L utilisateur\u00b7ice construit sa requ\u00eate sur la base des concepts et mots-cl\u00e9s s\u00e9lectionn\u00e9s dans cette phase it\u00e9rative d exploration (la s\u00e9lection est visible en vert sur la figure{.ref}). Le lancement d une recherche d articles laisse voir les panels listant les r\u00e9sultats des requ\u00eates permettant ainsi une visualisation de l impact habituellement invisible de la m\u00e9diation par les GML dans les pratiques de recherche ([panels]{.ref}). []{#panels} \u00c9valuations \u00c9valuation de GML pour le parsing s\u00e9mantique en IEML L une des principales fonctionnalit\u00e9s du SR est la traduction collaborative homme-machine en IEML propos\u00e9e pour des mots-cl\u00e9s absents de la base de donn\u00e9es valid\u00e9e manuellement des concepts en IEML. Cette fonctionnalit\u00e9 repose sur une traduction propos\u00e9e par un GML que l utilisateur\u00b7ice peut corriger ([trad-ieml]{.ref}). Ces mots-cl\u00e9s corrig\u00e9s et valid\u00e9s sont ensuite ajout\u00e9s \u00e0 la base de donn\u00e9es IEML, conform\u00e9ment \u00e0 la notion d intelligence collective affirm\u00e9e par le concepteur d IEML (L\u00e9vy, 1997). model BLEU avg cosine avg avg noRAG llama_fewshot 5.6e-2 0.515 0.286 llama_zeroshot 1.3e-2 0.514 0.263 gemma_zeroshot 1.6e-2 0.479 0.248 openai_zeroshot 1.6e-2 0.493 0.255 llama_fewshot 2.2e-2 0.555 0.289 gemma_fewshot 2.0e-2 0.491 0.255 openai_fewshot 1.7e-2 0.498 0.257 : R\u00e9sultat des traductions en IEML par GML de 360\u00a0mots-cl\u00e9s []{#rag-eval} Pour cette t\u00e2che, nous avons \u00e9valu\u00e9 trois GML propri\u00e9taires (GPT-oss-20B, Meta-Llama-3-70B-Instruct-Turbo, Gemma-3n-E4V-it) sur leur capacit\u00e9 \u00e0 traduire 360\u00a0mots-cl\u00e9s en IEML partant d un syst\u00e8me de g\u00e9n\u00e9ration augment\u00e9e de r\u00e9cup\u00e9ration (RAG) avec un prompt contenant 60 exemples et une r\u00e9cup\u00e9ration de 20\u00a0mots s\u00e9lectionn\u00e9s dans le dictionnaire IEML (~3\u202f000\u00a0entr\u00e9es). Les scores quantitatifs montrent des gains n\u00e9gligeables avec les exemples contextuels ([rag-eval]{.ref}), et l analyse qualitative a confirm\u00e9 que les mod\u00e8les \u00e9chouent \u00e0 reproduire les contraintes structurelles d IEML. Les mesures de distances s\u00e9mantiques (cosine et score BLEU) ne conviennent que partiellement \u00e0 l \u00e9valuation de la traduction; la comparaison de vecteurs ne rend pas compte de l int\u00e9r\u00eat de la concat\u00e9nation de concepts s\u00e9mantiques possiblement \u00e9loign\u00e9s mais pertinents dans une traduction en IEML. Cela confirme les r\u00e9sultats de (Ettinger et al., 2023) sur les limites des GML pour le parsing s\u00e9mantique structur\u00e9, et souligne l importance de la validation humaine pour ce type de t\u00e2che. Ce r\u00e9sultat oriente nos perspectives vers de futurs designs de SR int\u00e9grant les retours et interpr\u00e9tations humaines, deux processus cognitifs fondamentaux de la d\u00e9couverte informationnelle fortuite (Makri & Blandford, 2012). \u00c9tude utilisateur M\u00e9thodologie Apr\u00e8s l installation et une d\u00e9monstration de l ensemble des fonctionnalit\u00e9s du SR, six utilisateur\u00b7ice\u00b7s volontaires ont \u00e9t\u00e9 observ\u00e9\u00b7e\u00b7s lors d une session de 10\u00a0minutes d interaction avec le plugiciel, suivie d un entretien de 15\u00a0minutes couvrant les fonctionnalit\u00e9s et aspects centraux\u00a0: ergonomie, utilit\u00e9, navigation par mots-cl\u00e9s, traduction en IEML, recherche d articles et comparaison des panels de listes d articles extraits. Les utilisateur\u00b7ice\u00b7s \u00e9taient six doctorant\u00b7e\u00b7s en humanit\u00e9s num\u00e9riques et connaissaient tous les d\u00e9veloppeur\u00b7se\u00b7s. Les auteur\u00b7ice\u00b7s reconnaissent que ces deux \u00e9l\u00e9ments constituent des biais importants de cette \u00e9tude et en limitent la port\u00e9e analytique. R\u00e9sultats et discussion Les observations issues de l exp\u00e9rience indiquent que tous les participant\u00b7e\u00b7s ont extrait des articles via le SR, sugg\u00e9rant que l outil a facilit\u00e9 l acc\u00e8s \u00e0 une litt\u00e9rature auparavant inconnue, y compris pour celles et ceux qui ne recourent pas habituellement \u00e0 la recherche par mots-cl\u00e9s. Bien que tous les utilisateur\u00b7ice\u00b7s aient formul\u00e9 plusieurs requ\u00eates et compar\u00e9 les listes d articles \u00e0 des degr\u00e9s divers, un seul s est engag\u00e9 de mani\u00e8re \u00e9quivalente dans les deux \u00e9tapes. Tous sauf un ont corrig\u00e9 les traductions g\u00e9n\u00e9r\u00e9es par les LLM, et une participante les a annot\u00e9es plut\u00f4t que remplac\u00e9es, indiquant que des productions de faible qualit\u00e9 peuvent susciter une posture dialogique et collaborative vis-\u00e0-vis des t\u00e2ches s\u00e9mantiques. De telles traductions imparfaites semblent favoriser la r\u00e9flexivit\u00e9 dans l articulation de concepts s\u00e9mantiquement riches et soutenir l appropriation de l outil par l utilisateur\u00b7ice. \u00c9tant donn\u00e9 le nombre limit\u00e9 de mots-cl\u00e9s pr\u00e9traduits (420\u00a0au moment de la r\u00e9daction), les utilisateur\u00b7ice\u00b7s ont fr\u00e9quemment rencontr\u00e9 des concepts \"non traduits\"; loin de constituer une simple contrainte, cette lacune repr\u00e9sente une opportunit\u00e9 de renforcer l agentivit\u00e9 des utilisateur\u00b7ice\u00b7s en les invitant \u00e0 formuler el\u00b7eux-m\u00eames les correspondances conceptuelles manquantes en IEML et \u00e0 participer \u00e0 l appropriation du SR. Les participant\u00b7e\u00b7s ont recommand\u00e9 diverses am\u00e9liorations fonctionnelles et ajustements UX, mais de nombreuses limites semblent r\u00e9solubles par une int\u00e9gration directe \u00e0 Isidore (par exemple\u00a0: maintien de l \u00e9tat de session, fiches de m\u00e9tadonn\u00e9es compl\u00e8tes, distinction plus claire entre la construction de requ\u00eates et la r\u00e9cup\u00e9ration de documents, et r\u00e9duction de la latence caus\u00e9e par les appels d API en cha\u00eene). Les forces et limites du SR d\u00e9velopp\u00e9 seront d\u00e9taill\u00e9es lors de la conf\u00e9rence. Perspectives \u00c0 notre connaissance, cet outil constitue la premi\u00e8re application de construction de requ\u00eates impliquant une conceptualisation s\u00e9mantique r\u00e9alis\u00e9e de mani\u00e8re collaborative par un humain et un LLM.\u00a0Nous tenons que les SR peuvent \u00eatre des outils critiques qui exposent, plut\u00f4t que dissimulent, les diff\u00e9rences de mod\u00e9lisation en amont de la RI (ontologie vs hypoth\u00e8se distributionnelle). Dans cette perspective, le travail amorc\u00e9 tant lors du d\u00e9veloppement de notre RS que lors de son \u00e9valuation laisse voir que les pratiques de recherche informationnelle demeurent vari\u00e9es et qu il y a encore une place pour la recherche r\u00e9flexive en contexte scientifique. De futurs travaux pourraient mettre \u00e0 profit cette construction it\u00e9rative d une requ\u00eate dans un contexte exploratoire pour valoriser et permettre \u00e0 l utilisateur\u00b7ice de d\u00e9finir plus clairement ses intentions, intentionalit\u00e9s floues notamment observ\u00e9es dans les usages d interaction en langue naturelle av alities of the recommender system developed in this project: constructing a query through iterative interactions involving terms and definitions using the IEML language; comparing result lists displayed side-by-side from the user-constructed query and the same query \"augmented\" by an LLM. Second, we will present the evaluation of the semantic parsing into IEML performed by an LLM on a corpus of 360 terms, as well as the results of a small sample user study.",

    "content": "Introduction Dans Computing Machinery and Intelligence, (Turing, 1950) a pr\u00e9sent\u00e9 ce qui est devenu le Test de Turing Standard (STT), o\u00f9 un interrogateur doit d\u00e9terminer lequel de deux interlocuteurs cach\u00e9s est humain. Pourtant, la premi\u00e8re version du jeu, d\u00e9crite dans le m\u00eame texte, est bien moins discut\u00e9e\u00a0: Il se joue avec trois personnes\u00a0: un homme (A), une femme (B) et un interrogateur (C), qui peut \u00eatre de l un ou l autre sexe. [...] L objectif du jeu pour l interrogateur est de d\u00e9terminer qui des deux autres est l homme et qui est la femme. [...] Nous posons maintenant la question\u00a0: \u00ab\u00a0Que se passera-t-il lorsqu une machine prendra la place de A dans ce jeu\u202f? 1 ---\u00a0(Turing, 1950) Malgr\u00e9 sa place premi\u00e8re dans l article de Turing, ce Test de Turing Genr\u00e9 (ou Gendered Turing Test, GTT) exigeant que la machine incarne une femme n a jamais \u00e9t\u00e9 mis en pratique. Nous pensons que sa valeur r\u00e9side dans son cadre provocateur et qu il m\u00e9rite d \u00eatre r\u00e9actualis\u00e9 dans les d\u00e9bats contemporains sur l intelligence, qu elle soit artificielle ou humaine. Suivant l hypoth\u00e8se de (Sterrett, 2000) selon laquelle le GTT serait \"l indication la plus appropri\u00e9e de l intelligence\" nous avons \u00e9mis l hypoth\u00e8se que le GTT \u00e9galiserait le terrain entre l humain et la machine, et qu il constituerait un test empirique de l intelligence bas\u00e9 sur un objectif commun de tromperie. Pour le v\u00e9rifier, nous avons con\u00e7u une exp\u00e9rience \u00e0 petite \u00e9chelle impliquant 9 participant\u00b7e\u00b7s humain\u00b7e\u00b7s (4\u00a0femmes, 3\u00a0hommes et 2\u00a0interrogateurs de genre masculin)2 et le mod\u00e8le de langue ChatGPT-4, tous ayant pour objectif de jouer le r\u00f4le d une femme. Dans cette exp\u00e9rimentation, l interrogateur converse s\u00e9par\u00e9ment avec deux interlocuteur\u00b7ice\u00b7s invisibles, via des m\u00e9diateurs humains. Chaque \u00e9change dure trois minutes, et les messages sont retard\u00e9s pour uniformiser la dur\u00e9e de frappe. Deux sessions totalisant quinze tours nous ont permis d observer comment les participant\u00b7e\u00b7s \u00e9tablissent ou non une strat\u00e9gie sous la contrainte enfin, nous avons collectivement comment\u00e9 l exp\u00e9rience. \u00c0 partir de cette r\u00e9actualisation, nous soutenons que le GTT n avait pas encore \u00e9t\u00e9 mis en application car sa structure r\u00e9v\u00e8le des biais culturels et interpr\u00e9tatifs, notamment autour de la performance genr\u00e9e, que le STT tend \u00e0 laisser implicite. Plut\u00f4t que de mesurer l intelligence, les deux versions du jeu de l imitation fonctionnent comme des espaces o\u00f9 les pr\u00e9suppos\u00e9s des exp\u00e9rimentateur\u00b7ice\u00b7s au sujet de l intelligence sont expos\u00e9s. Le GTT le rend particuli\u00e8rement explicite\u00a0: identifier un persona uniquement sur un crit\u00e8re de genre souligne la complexit\u00e9 du genre en tant que performance linguistique et culturelle. Revisiter le GTT permet ainsi de recadrer le STT, montrant que la clart\u00e9 apparente qui a favoris\u00e9 son adoption repose sur des pr\u00e9suppos\u00e9s concernant humain et machine. L ind\u00e9termination conceptuelle pr\u00e9sente dans la formulation originale de Turing persiste, sugg\u00e9rant que les deux tests en r\u00e9v\u00e8lent davantage sur nos cadres interpr\u00e9tatifs que sur la cognition machine. \u00c9tat de l art Les recherches sur l article de Turing se concentrent principalement sur le STT et ses impl\u00e9mentations. Alors que les d\u00e9bats sur les capacit\u00e9s cognitives des grands mod\u00e8les de langue (Large Language Model, LLM) LLM abondent, les \u00e9valuations utilisant le STT restent inconcluantes\u00a0: (Jones & Bergen, 2025) rapportent dans une exp\u00e9rimentation de grande \u00e9chelle que GPT-4.5\u00a0a tromp\u00e9 les interrogateurs dans 76\u202f% des parties, tandis que (Restrepo Echavarr\u00eda, 2025) observe l inverse, avec une identification de l IA dans 9\u00a0interactions sur 10. L accent mis sur le STT pourrait s expliquer par le fait que beaucoup interpr\u00e8tent le GTT comme un dispositif purement illustratif ou m\u00e9taphorique (par ex. (Gon\u00e7alves, 2024) et (Piccinini, 2000)). D autres, cependant, consid\u00e8rent la version litt\u00e9rale comme significative. (Genova, 1994) l interpr\u00e8te comme un reflet des vues personnelles de Turing sur l identit\u00e9 sexuelle, sugg\u00e9rant que la performativit\u00e9 genr\u00e9e fournit d\u00e9j\u00e0 un mod\u00e8le pour comprendre comment l imitation linguistique pourrait constituer une forme de pens\u00e9e. Malgr\u00e9 l int\u00e9r\u00eat th\u00e9orique pour le GTT, seul (Patterson et al., 2018) a tent\u00e9 une approximation empirique sous ce nom, en se concentrant sur des humains devinant le genre d un\u00b7e auteur\u00b7ice\u00b7 \u00e0 partir de courts textes. Cependant, leur \u00e9tude n impliquait ni dialogue produit par une machine ni \u00e9change interactif dans un cadre ludique. Il manque alors une r\u00e9actualisation interactive du GTT mettant en sc\u00e8ne les \"machines de Turing\" \u00e0 l \u00e9tat de l art, \u00e0 savoir les LLMs conversationnels ou g\u00e9n\u00e9ratifs. R\u00e9sultats de l exp\u00e9rience du jeu genr\u00e9\u00a0: Jouer la f\u00e9minit\u00e9 Des quinze parties de notre exp\u00e9rimentation, hommes, femmes et IA ont tous remport\u00e9 plusieurs parties. Bien qu \u00e0 petite \u00e9chelle, ce r\u00e9sultat souligne la nature performative du dispositif et la profonde artificialit\u00e9 de la performance genr\u00e9e (Butler, 2011). Les participantes, quant \u00e0 elles, ont d\u00e9lib\u00e9r\u00e9 sur l opportunit\u00e9 d exag\u00e9rer les traits f\u00e9minins ou de pr\u00e9senter un \"soi non marqu\u00e9\". Certaines ont m\u00eame envisag\u00e9 d adopter un persona \"plus masculin\", bien que cela aille contre leur int\u00e9r\u00eat dans la partie, afin soit de remettre en question les pr\u00e9misses du jeu soit de recourir \u00e0 des pratiques famili\u00e8res de gender swapping en ligne (Hussain & Griffiths, 2008; Tang et al., 2020). Les participants masculins, qu ils soient joueurs ou interrogateurs, avaient tendance \u00e0 s appuyer sur des indices formels (ponctuation, \u00e9motic\u00f4nes) plut\u00f4t que sur le contenu s\u00e9mantique des \u00e9changes. Le LLM, pour sa part, a perform\u00e9 de mani\u00e8re coh\u00e9rente en suivant le prompt donn\u00e9, d\u00e9montrant que la f\u00e9minit\u00e9 peut \u00eatre mod\u00e9lis\u00e9e par des instructions basiques en langue naturelle. Nous avons observ\u00e9 que les interrogateurs \u00e9valuaient les r\u00e9ponses qui leur \u00e9taient envoy\u00e9es en fonction de leurs propres biais et extrapolaient \u00e0 partir de micro-indices linguistiques pr\u00e9sents dans les r\u00e9ponses des interlocuteurs. Ce que cette instance du GTT a r\u00e9v\u00e9l\u00e9 \u00e9tait donc moins un concours de tromperie qu un th\u00e9\u00e2tre d interpr\u00e9tations. Notre exp\u00e9rience sugg\u00e8re que l une des raisons pour lesquelles le premier jeu de l imitation de Turing n a rarement, voire jamais \u00e0 notre connaissance, \u00e9t\u00e9 jou\u00e9 litt\u00e9ralement est qu il fonctionne moins comme un test universel d intelligence que comme un miroir tendu \u00e0 notre imagination linguistique et sociale. Le rejouer aujourd hui avec des LLMs, capables d interpr\u00e9ter \u00e0 un haut degr\u00e9 de fid\u00e9lit\u00e9 un personnage humain, rend visible l ambigu\u00eft\u00e9 proc\u00e9durale et la volatilit\u00e9 interpr\u00e9tative qui ont maintenu cette version du jeu largement th\u00e9orique. Perspectives Cette r\u00e9actualisation du GTT d\u00e9montre comment les m\u00e9thodes des humanit\u00e9s num\u00e9riques peuvent r\u00e9activer des exp\u00e9riences de pens\u00e9e classiques dans le contexte de questionnement collectif sur l IA, r\u00e9v\u00e9lant les pr\u00e9suppos\u00e9s culturels et interpr\u00e9tatifs que ces outils int\u00e8grent. En promptant un LLM d adopter un personnage linguistique genr\u00e9 \u00e0 partir d un minimum de consignes, l exp\u00e9rience montre que les machines peuvent ma\u00eetriser une comp\u00e9tence linguistique, ce qui peut \u00eatre compris comme une d\u00e9finition tr\u00e8s \u00e9troite de l intelligence, et non comme une norme universelle. Dans ce contexte, ce qui est mis \u00e0 l \u00e9preuve ne sont pas les LLMs, mais plut\u00f4t les biais humains expos\u00e9s par le travail interpr\u00e9tatif des interrogateurs lorsqu ils attribuent une identit\u00e9, genr\u00e9e ou autre, dans l incertitude. L ambigu\u00eft\u00e9 r\u00e9v\u00e9l\u00e9e par le travail interpr\u00e9tatif des interrogateurs, ambigu\u00eft\u00e9 \u00e9galement pr\u00e9sente dans les impl\u00e9mentations du STT mais ignor\u00e9e par les \u00e9tudes pr\u00e9c\u00e9demment cit\u00e9es, rappelle de longs d\u00e9bats philosophiques o\u00f9 l intelligence humaine est d\u00e9finie en contraste avec ce que les machines ne peuvent pas encore faire, comme le sugg\u00e8re la Chambre chinoise de (Searle, 1980). Rejouer le GTT clarifie donc que les deux tests de Turing interrogent, plut\u00f4t qu ils ne d\u00e9terminent, la fronti\u00e8re entre cognition humaine et machine, ainsi que les diff\u00e9rentes fa\u00e7ons de d\u00e9finir l intelligence. R\u00e9f\u00e9rences Turing, A. M. (1950). Computing Machinery and Intelligence. Mind; a Quarterly Review of Psychology and Philosophy, LIX(236), 433\u2011460. https://doi.org/10.1093/mind/LIX.236.433 \u21a9 Sterrett, S. G. (2000). Turing s Two Tests for Intelligence. Minds and Machines, 10(4), 541\u2011559. https://doi.org/10.1023/A:1011242120015 \u21a9 Jones, C. R., & Bergen, B. K. (2025). Large Language Models Pass the Turing Test. arXiv. https://doi.org/10.48550/arXiv.2503.23674 \u21a9 Restrepo Echavarr\u00eda, R. (2025). ChatGPT-4 in the Turing Test. Minds and Machines, 35(1), 8. https://doi.org/10.1007/s11023-025-09711-6 \u21a9 Gon\u00e7alves, B. (2024). Turing s Test, a Beautiful Thought Experiment. IEEE Annals of the History of Computing, 46(3), 36\u201149. https://doi.org/10.1109/MAHC.2024.3432278 \u21a9 Piccinini, G. (2000). Turing s Rules for the Imitation Game. Minds and Machines, 10(4), 573\u2011582. https://doi.org/10.1023/A:1011246220923 \u21a9 Genova, J. (1994). Turing s sexual guessing game. Social Epistemology, 8(4), 313\u2011326. https://doi.org/10.1080/02691729408578758 \u21a9 Patterson, W., Boboye, J., Hall, S., & Hornbuckle, M. (2018). The Gender Turing Test. In D. Nicholson (\u00c9d.), Advances in Human Factors in Cybersecurity (p. 281\u2011289). Springer International Publishing. https://doi.org/10.1007/978-3-319-60585-2_26 \u21a9 Butler, J. (2011). Gender Trouble: Feminism and the Subversion of Identity. Routledge. https://doi.org/10.4324/9780203824979 \u21a9 Hussain, Z., & Griffiths, M. D. (2008). Gender Swapping and Socializing in Cyberspace: An Exploratory Study. CyberPsychology & Behavior, 11(1), 47\u201153. https://doi.org/10.1089/cpb.2007.0020 \u21a9 Tang, W. Y., Reer, F., & Quandt, T. (2020). Investigating sexual harassment in online video games: How personality and context factors are related to toxic sexual behaviors against fellow players. Aggressive Behavior, 46(1), 127\u2011135. https://doi.org/10.1002/ab.21873 \u21a9 Searle, J. R. (1980). Minds, brains, and programs. Behavioral and Brain Sciences, 3(3), 417\u2011424. https://doi.org/10.1017/S0140525X00005756 \u21a9 Notre traduction\u21a9 Les participant\u00b7e\u00b7s se sont identifi\u00e9\u00b7e\u00b7s en genre.\u21a9 We are updating the lesser-known gendered Turing Test by using both human participants and an LLM programmed to \"play a woman.\" The experiment reveals how gendered imitation highlights cultural and interpretive biases, demonstrating that the original Turing Test exposes our assumptions about intelligence more than it assesses the machine s cognitive abilities.",

      form.addEventListener('submit', function(event) {
        event.preventDefault()
        search(input.value)
      })

      // Create a typeahead handler
      form.addEventListener('keyup', function(event) {
        search(input.value)
      })

      // Create a reset handler
      form.addEventListener('reset', function() {
        search('')
        searchStatus.innerHTML = ''
      })

      // Check for query strings onload
      onload()

      /**
       * If there's a query string search term, search it on page load
       */
      function onload() {
        let query = new URLSearchParams(window.location.search).get('q')
        if (!query) return
        input.value = query
        search(query)
      }

      /**
       * Search for matches
       * @param  {String} query The term to search for
       */
      function search(query) {
        // Create a regex for each query
        let regMap = query
          .toLowerCase()
          .split(' ')
          .filter(function(word) {
            return word.length && !stopWords.includes(word)
          })
          .map(function(word) {
            return new RegExp(word, 'i')
          })

        // Get and sort the results
        let results = searchIndex
          .reduce(function(results, article, index) {
            // Setup priority count
            let priority = 0

            // Assign priority
            for (let reg of regMap) {
              if (reg.test(article.numero_title)) {
                priority += 500
              }
              if (reg.test(article.title)) {
                priority += 100
              }
              let occurences = article.content.match(reg)
              if (occurences) {
                priority += occurences.length
              }
            }

            // If any matches, push to results
            if (priority > 0) {
              results.push({
                priority: priority,
                article: article,
              })
            }

            return results
          }, [])
          .sort(function(article1, article2) {
            return article2.priority - article1.priority
          })

        results = [
          ...new Map(results.map(item => [item['article']['title'], item])).values()
        ]

        // Display the results
        showResults(query, results, regMap)

        // Update the URL
        updateURL(query)
      }

      /**
       * Show the search results in the UI
       * @param  {Array}  results The results to display
       * @param  {List}  regMap Regular expressions for the highlights
       */
      function showResults(query, results, regMap) {
        let status = 'Aucune occurence n’a été trouvée.'
        let searchResults = ''
        if (results.length) {
          const plural = results.length > 1 ? 's' : ''
          status = `${results.length} section${plural} trouvée${plural} !`
          searchResults = results
            .map(function(result) {
              let [url, anchor] = result.article.url.split('#') // Happens for contenus add.
              // We avoid length > 1, because text fragment will only match the first term.
              if (!anchor && regMap.length === 1) {
                anchor = `:~:text=${regMap[0].source}`
              }
              anchor = anchor ? `#${anchor}` : ''
              return interpolate(searchResultTemplate.innerHTML, {
                url: `${url}?q=${query}${anchor}`,
                title: highlightText(result.article.title, regMap),
                date: result.article.date,
                content: highlightText(result.article.content, regMap),
                numero_title: highlightText(result.article.numero_title, regMap),
                numero_url: result.article.numero_url,
                numero_date: result.article.numero_date,
              })
            })
            .join('')
        }
        searchStatus.innerHTML = status
        resultList.innerHTML = searchResults
      }

      /**
       * Get a template from a string
       * https://stackoverflow.com/a/41015840
       * https://gomakethings.com/html-templates-with-vanilla-javascript/
       * @param  {String} str    The string to interpolate
       * @param  {Object} params The parameters
       * @return {String}        The interpolated string
       */
      function interpolate(str, params) {
        let names = Object.keys(params)
        let vals = Object.values(params)
        return new Function(...names, `return \`${str}\``)(...vals)
      }

      /**
       * Highlight the text in the UI
       * @param  {String}  text The content to highlight
       * @param  {List}  regMap Regular expressions for the highlights
       */
      function highlightText(text, regMap) {
        // TODO: deal with close matches when multiple words are looked for,
        // it does not look trivial because you have to memorize positions
        // then create extracts.
        // For instance: `microsoft github`
        const extractBoundariesSize = 100
        const textLength = text.length
        let extracts = []
        for (let reg of regMap) {
          const index = text.search(reg)
          if (index === -1) {
            continue
          }
          let extract = text.substring(
            index - extractBoundariesSize,
            index + reg.source.length + extractBoundariesSize
          )
          // TODISCUSS: we replace with the source but in case there is
          // an uppercase letter it will disappear from the extract
          // (is that confusing or closer to what is expected?)
          extract = extract.replace(reg, `<mark>${reg.source}</mark>`)
          const prefixEllipsis = index - extractBoundariesSize >= 0 ? '…' : ''
          const suffixEllipsis =
            index + extractBoundariesSize <= textLength ? '…' : ''
          extracts.push(`${prefixEllipsis}${extract}${suffixEllipsis}`)
        }
        if (!extracts.length && textLength < 200) {
          // If there is no match but it's a short title, return it.
          return text
        }
        return extracts.join('')
      }

      /**
       * Update the URL with a query string for the search string
       * @param  {String} query The search query
       */
      function updateURL(query) {
        // Create the properties
        let state = history.state
        let title = document.title
        let url = window.location.origin + window.location.pathname
        if (query) {
          url += '?q=' + encodeURI(query)
        }

        // Update the URL
        history.pushState(state, title, url)
      }
    })()
  </script>
